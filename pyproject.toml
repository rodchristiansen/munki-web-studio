[project]
name = "munki-web-studio"
version = "0.1.0"
description = "A web workspace for Munki repositories."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "fastmcp>=4.1.6",
    "ruamel-yaml>=0.19.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
mwsctl = "munki_web_studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munki_web_studio"]
artifacts = ["src/munki_web_studio/static/**"]

[tool.ruff]
line-length = 100
extend-exclude = ["web"]
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
