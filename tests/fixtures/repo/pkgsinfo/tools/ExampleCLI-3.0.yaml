# Munki YAML pkginfo, invented values.
name: ExampleCLI
display_name: Example CLI
version: "3.0"
catalogs:
  - testing
category: Utilities
installer_item_location: apps/ExampleCLI-3.0.pkg
receipts:
  - packageid: com.example.cli
    version: "3.0"
minimum_os_version: "13.0"
unattended_install: true
installcheck_script: |
